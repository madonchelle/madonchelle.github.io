<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoría | MADONCHELLE</title>
    <style>
        @font-face {
            font-family: "Modern Romance";
            src: url("Modern%20Romance.otf") format("opentype");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: "Clash Display";
            src: url("ClashDisplay-Variable.woff2") format("woff2");
            font-style: normal;
            font-weight: 200 700;
            font-display: swap;
        }

        @font-face {
            font-family: "Tamrin";
            src: url("Tamrin.otf") format("opentype");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: "High Cruiser";
            src: url("HighCruiser-PersonalUseOnly.otf") format("opentype");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #17251f;
            background: var(--page-background);
            font-family: "Clash Display", sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        :root {
            --header-height: 90px;
            --page-background: #fafafa;
            --site-header-background: var(--page-background);
            --page-scrollbar-width: 2px;
            --page-scrollbar-thumb: #777777;
            --page-scrollbar-track: #000000;
            --page-scrollbar-thumb-hover: #999999;
        }

        html {
            scrollbar-color: var(--page-scrollbar-thumb) var(--page-scrollbar-track);
            scrollbar-width: thin;
        }

        html::-webkit-scrollbar {
            width: var(--page-scrollbar-width);
        }

        html::-webkit-scrollbar-track {
            background: var(--page-scrollbar-track);
        }

        html::-webkit-scrollbar-thumb {
            border: 0;
            border-radius: 999px;
            background: var(--page-scrollbar-thumb);
        }

        html::-webkit-scrollbar-thumb:hover {
            background: var(--page-scrollbar-thumb-hover);
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            min-height: var(--header-height);
            align-items: center;
            justify-content: space-between;
            padding: 4px 32px;
            background: var(--site-header-background);
            transition: min-height 220ms ease;
        }

        .header-back,
        .header-cart {
            display: grid;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #17251f;
            transition: color 180ms ease, background 180ms ease, transform 180ms ease;
            place-items: center;
            text-decoration: none;
        }

        .header-back svg {
            display: block;
            width: 25px;
            height: 25px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.35;
        }

        .header-back:hover,
        .header-back:focus-visible {
            color: #18372d;
            background: var(--page-background);
            transform: translateX(-2px);
        }

        .header-cart {
            display: grid;
            position: relative;
            width: 40px;
            height: 40px;
            margin-left: auto;
            border: 0;
            color: #18372d;
            background: transparent;
            cursor: pointer;
            place-items: center;
            transition: color 180ms ease, transform 180ms ease;
        }

        .header-cart svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.35;
        }

        .header-cart:hover,
        .header-cart:focus-visible {
            color: #777777;
            transform: translateY(-1px);
        }

        .site-logo {
            display: flex;
            position: absolute;
            top: calc(50% - 2px);
            left: 50%;
            align-items: center;
            justify-content: center;
            width: max-content;
            color: #17251f;
            font-family: "High Cruiser", sans-serif;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            transition: transform 420ms ease, font-size 420ms ease;
            user-select: none;
            -webkit-user-select: none;
        }

        @media (max-width: 720px) {
            .site-logo {
                font-size: 18px;
            }
        }

        main {
            display: grid;
            width: min(calc(100% - 64px), 1440px);
            min-height: calc(100vh - var(--header-height));
            grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr);
            margin: 0 auto;
            padding: 36px 0 72px;
        }

        .category-search {
            min-width: 0;
            border-right: 1px solid #000000;
            padding: 8px 28px 24px 0;
        }

        .search-form {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #17251f;
            padding: 8px 4px 12px;
        }

        .search-form svg {
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #17251f;
            stroke-linecap: round;
            stroke-width: 1.8;
        }

        .search-form input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            color: #17251f;
            background: transparent;
            font: inherit;
            font-size: 14px;
        }

        .search-form input::placeholder {
            color: #64736c;
        }

        .category-products {
            min-width: 0;
            padding: 0 0 0 32px;
        }

        .category-title-box {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            margin-bottom: 24px;
            border: 1px solid #17251f;
            padding: 8px 18px;
            background: var(--page-background);
        }

        .category-title-box h1 {
            margin: 0;
            font-family: "High Cruiser", sans-serif;
            font-size: clamp(22px, 2.6vw, 32px);
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .product-card {
            display: flex;
            min-width: 0;
            flex-direction: column;
            background: var(--page-background);
        }

        @keyframes skeleton-shimmer {
            from {
                background-position: -200% 0;
            }

            to {
                background-position: 200% 0;
            }
        }

        .product-card.is-loading .product-image {
            background-color: #e7e7e5;
            background-image: linear-gradient(90deg, #e7e7e5 0%, #eeeeec 36%, #ffffff 50%, #eeeeec 64%, #e7e7e5 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.2s linear infinite;
        }

        .product-card.is-loading .product-image img {
            visibility: hidden;
        }

        .product-link {
            color: inherit;
            text-decoration: none;
        }

        .product-image {
            display: block;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background: #f5f3f0;
        }

        .product-image img {
            display: block;
            width: 100%;
            height: 100%;
            padding: 8%;
            object-fit: contain;
            transition: transform 180ms ease;
        }

        .product-card[data-id="bolso-lino"] .product-image img {
            object-fit: contain;
        }

        .product-link:hover .product-image img,
        .product-link:focus-visible .product-image img {
            transform: scale(1.035);
        }

        .product-card h2 {
            margin: 0;
            padding: 12px 12px 4px;
            font-family: "Clash Display", sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1.2;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .product-card.is-loading h2,
        .product-card.is-loading .product-card-price {
            border-radius: 3px;
            color: transparent;
            background-color: #e7e7e5;
            background-image: linear-gradient(90deg, #e7e7e5 0%, #eeeeec 36%, #ffffff 50%, #eeeeec 64%, #e7e7e5 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.2s linear infinite;
        }

        .product-card.is-loading h2 {
            width: 72%;
        }

        .product-card.is-loading .product-card-price {
            width: 38%;
        }

        .product-card-price {
            margin: 0;
            padding: 0 12px 12px;
            color: #64736c;
            font-family: "Clash Display", sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: auto;
            padding: 0 8px 10px;
        }

        .add-to-cart,
        .wish-button {
            min-height: 38px;
            border: 0;
            cursor: pointer;
        }

        .add-to-cart {
            flex: 1;
            padding: 8px 10px;
            color: #ffffff;
            background: #18372d;
            font: inherit;
            font-size: 12px;
        }

        .wish-button {
            width: 40px;
            color: #18372d;
            background: transparent;
            font-size: 24px;
        }

        .product-card.is-loading .card-actions button {
            border-radius: 3px;
            color: transparent;
            background-color: #e7e7e5;
            background-image: linear-gradient(90deg, #e7e7e5 0%, #eeeeec 36%, #ffffff 50%, #eeeeec 64%, #e7e7e5 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.2s linear infinite;
        }

        .wish-button.is-saved {
            color: #c75445;
        }

        @media (prefers-reduced-motion: reduce) {
            .product-card.is-loading .product-image,
            .product-card.is-loading h2,
            .product-card.is-loading .product-card-price,
            .product-card.is-loading .card-actions button {
                animation: none;
            }
        }

        .no-results {
            grid-column: 1 / -1;
            color: #64736c;
            line-height: 1.6;
        }

        .cart-overlay {
            position: fixed;
            z-index: 19;
            inset: 0;
            visibility: hidden;
            background: rgba(23, 37, 31, 0.35);
            opacity: 0;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        .cart-overlay.is-visible {
            visibility: visible;
            opacity: 1;
        }

        .cart-panel {
            position: fixed;
            z-index: 20;
            top: 0;
            right: 0;
            display: flex;
            width: min(420px, 100%);
            height: 100vh;
            height: 100dvh;
            flex-direction: column;
            padding: 28px;
            background: var(--page-background);
            box-shadow: -12px 0 35px rgba(23, 37, 31, 0.16);
            transform: translateX(105%);
            transition: transform 220ms ease;
        }

        .cart-panel.is-open {
            transform: translateX(0);
        }

        .cart-header,
        .cart-item,
        .panel-tabs {
            display: flex;
            align-items: center;
        }

        .cart-header {
            justify-content: space-between;
            border-bottom: 1px solid #dce3dd;
            padding-bottom: 18px;
        }

        .cart-header h2 {
            margin: 0;
            font-size: 25px;
        }

        .close-button {
            border: 0;
            color: #18372d;
            background: transparent;
            cursor: pointer;
            font-size: 28px;
        }

        .panel-tabs {
            gap: 8px;
            padding: 18px 0;
        }

        .tab-button {
            flex: 1;
            border: 1px solid #dce3dd;
            padding: 11px 8px;
            color: #000000;
            background: var(--page-background);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .tab-button.is-active {
            color: #ffffff;
            background: #000000;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid #edf0eb;
            padding: 16px 0;
        }

        .cart-item strong,
        .cart-item span {
            display: block;
        }

        .cart-item strong {
            margin-bottom: 5px;
            font-size: 14px;
        }

        .cart-item span {
            color: #64736c;
            font-size: 13px;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .quantity-button,
        .remove-button {
            border: 1px solid #dce3dd;
            color: #18372d;
            background: var(--page-background);
            cursor: pointer;
        }

        .quantity-button {
            width: 26px;
            height: 26px;
        }

        .remove-button {
            margin-top: 2px;
            border: 0;
            color: #c75445;
            font-size: 12px;
        }

        .empty-message {
            padding: 35px 0;
            color: #64736c;
            text-align: center;
            line-height: 1.5;
        }

        .cart-footer {
            border-top: 1px solid #dce3dd;
            padding-top: 20px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .checkout-button {
            width: 100%;
            border: 0;
            padding: 14px;
            color: #000000;
            background: #f2b8c6;
            cursor: pointer;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            main {
                width: calc(100% - 40px);
                grid-template-columns: minmax(180px, 1fr) minmax(0, 2fr);
            }

            .product-grid {
                gap: 14px;
            }

            .category-products {
                padding-left: 20px;
            }
        }

        @media (max-width: 620px) {
            :root {
                --header-height: 76px;
            }

            .site-header {
                padding: 3px 16px;
            }

            .header-back,
            .header-cart {
                width: 36px;
                height: 40px;
            }

            .site-logo {
                font-size: clamp(11px, 3.4vw, 14px);
                letter-spacing: 0.02em;
            }

            .site-header.is-search-open .site-logo {
                display: none;
            }

            main {
                width: calc(100% - 32px);
                grid-template-columns: minmax(0, 1fr);
                padding: 22px 0 48px;
            }

            .category-search {
                border-right: 0;
                border-bottom: 1px solid #000000;
                padding: 0 0 18px;
            }

            .search-form {
                max-width: 100%;
            }

            .category-products {
                padding: 22px 0 0;
            }

            .category-title-box {
                min-height: 42px;
                margin-bottom: 18px;
                padding: 6px 14px;
            }

            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .product-card h2 {
                padding-right: 8px;
                padding-left: 8px;
                font-size: 14px;
            }

            .product-card-price {
                padding-right: 8px;
                padding-left: 8px;
            }

            .cart-panel {
                padding: 22px 20px;
            }

            .product-card .add-to-cart {
                padding-right: 6px;
                padding-left: 6px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="header-back" href="MADONCHELLE.html" aria-label="Volver a la página principal">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="m11.5 18.5-6.5-6.5 6.5-6.5"></path></svg>
        </a>
        <a class="site-logo" href="MADONCHELLE.html" aria-label="Makemma, página principal">
            MADONCHELLE
        </a>
        <button class="header-cart" id="cart-toggle" type="button" aria-label="Abrir carrito" aria-controls="cart-panel" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 8h14l-1.2 12H6.2L5 8Z"></path>
                <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
            </svg>
        </button>
    </header>
    <main>
        <aside class="category-search" aria-label="Buscar productos">
            <label class="search-form" for="product-search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
                <input id="product-search" type="search" placeholder="Buscar productos">
            </label>
        </aside>
        <section class="category-products" aria-labelledby="category-title">
            <div class="category-title-box"><h1 id="category-title"></h1></div>
            <div class="product-grid" id="product-grid" aria-live="polite"></div>
        </section>
    </main>
    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-panel" id="cart-panel" aria-label="Carrito y lista de deseos" aria-hidden="true">
        <div class="cart-header">
            <h2>Tu selección</h2>
            <button class="close-button" id="cart-close" type="button" aria-label="Cerrar carrito">&times;</button>
        </div>
        <div class="panel-tabs" role="tablist" aria-label="Contenido de tu selección">
            <button class="tab-button is-active" type="button" data-tab="cart" role="tab" aria-selected="true">Carrito</button>
            <button class="tab-button" type="button" data-tab="wishlist" role="tab" aria-selected="false">Lista de deseos (<span id="wishlist-count">0</span>)</button>
        </div>
        <div class="panel-content" id="panel-content"></div>
        <div class="cart-footer" id="cart-footer">
            <div class="cart-total"><span>Total</span><span id="cart-total">$0.00</span></div>
            <button class="checkout-button" id="checkout-button" type="button">Finalizar compra</button>
        </div>
    </aside>
    <script>
        const categories = {
            labiales: 'Labios',
            desmaquilladores: 'Desmaquilladores',
            bases: 'Cara',
            correctores: 'Correctores',
            polvos: 'Polvos fijadores',
            rubores: 'Rubores',
            mascaras: 'Ojos',
            cejas: 'Lápices de cejas'
        };
        const products = [
            { id: 'bolso-lino', name: 'Iluminador – Golden Aura', price: 6, description: 'Golden Aura aporta destellos luminosos para conseguir un acabado radiante. Aplícalo en los puntos del rostro que quieras destacar y difumina suavemente. Puedes graduar la intensidad para crear desde un brillo delicado hasta un efecto más luminoso.', category: 'iluminadores', image: 'Producto1.png' },
            { id: 'vela-alba', name: 'Base – Perfecté Skin', price: 9, description: 'Perfecté Skin tiene una textura ligera que ayuda a unificar el tono de la piel. Extiende una pequeña cantidad y difumina de manera uniforme para integrar el acabado. Una base sencilla de incorporar a tu rutina diaria de maquillaje.', category: 'bases', image: 'Producto2.png' },
            { id: 'pañuelo-azul', name: 'Bronzer – Soleil Touch', price: 6.5, description: 'Soleil Touch añade calidez y dimensión al rostro con un acabado natural. Difumina el producto gradualmente en las zonas que quieras definir y aportar un toque cálido. Su color acompaña tu maquillaje sin perder un aspecto equilibrado.', category: 'bronzers', image: 'Producto3.png' },
            { id: 'producto-4', name: 'Labial – Amour Satin', price: 5.5, description: 'Amour Satin es un labial cremoso que ofrece un color elegante y uniforme. Deslízalo sobre los labios para conseguir una aplicación pareja y cómoda. Su acabado ayuda a completar tanto maquillajes sencillos como looks más definidos.', category: 'labiales', image: 'Producto4.png' },
            { id: 'producto-5', name: 'Rubor – Rosé Bloom', price: 5.75, description: 'Rosé Bloom aporta un delicado toque de color a las mejillas para un aspecto fresco. Aplica poco a poco y difumina hasta alcanzar la intensidad que prefieras. Combina fácilmente con maquillajes naturales y tonos suaves.', category: 'rubores', image: 'Producto5.png' },
            { id: 'producto-6', name: 'Sombra – Velvet Dreams', price: 8.5, description: 'Velvet Dreams ofrece tonos suaves y elegantes con acabados mate y brillantes. Combina las texturas para crear profundidad o usa un tono por sí solo para un resultado sutil. Difumina los bordes para integrar el color en tu maquillaje.', category: 'sombras', image: 'Producto6.png' },
            { id: 'producto-7', name: 'Rímel – Noir Étoile', price: 5, description: 'Noir Étoile realza tus pestañas y aporta volumen y definición para destacar la mirada. Pasa el cepillo desde la raíz hasta las puntas con movimientos suaves. Añade otra capa si quieres intensificar el efecto.', category: 'mascaras', image: 'Producto7.png' },
            { id: 'producto-8', name: 'Delineador – Midnight Line', price: 3.75, description: 'Midnight Line es un delineador de color negro intenso para crear trazos finos y definidos. Su punta permite dibujar líneas precisas junto a las pestañas. Ajusta el grosor del trazo para lograr un acabado discreto o más marcado.', category: 'delineadores', image: 'Producto8.png' },
            { id: 'producto-9', name: 'Gloss – Rosé Glaze', price: 4.5, description: 'Rosé Glaze es un brillo labial luminoso que aporta color y frescura. Su aspecto natural y sofisticado combina con distintos estilos de maquillaje. Aplícalo solo para un toque ligero o sobre tu labial favorito.', category: 'labiales', image: 'Producto9.png' },
            { id: 'producto-10', name: 'Lápiz de ojos – Midnight Whisper', price: 3.5, description: 'Midnight Whisper tiene una textura suave y es fácil de aplicar. Define y resalta la mirada con trazos precisos para crear looks delicados o intensos. Puedes ajustar el resultado variando la presión y difuminando el trazo.', category: 'delineadores', image: 'Producto10.png' },
            { id: 'balsamo-rose-eclat', name: 'Bálsamo labial - Rosé Éclat', price: 4.99, description: 'Dale a tus labios un toque de suavidad y frescura con Rosé Éclat. Su textura cremosa aporta hidratación y un delicado brillo rosado. Perfecto para lucir unos labios radiantes, suaves y naturalmente hermosos.', category: 'labiales', image: 'Balsamo.png' }
        ];
        const categoryId = new URLSearchParams(window.location.search).get('categoria');
        const categoryName = categories[categoryId];
        const productGrid = document.getElementById('product-grid');
        const searchInput = document.getElementById('product-search');
        const cart = JSON.parse(localStorage.getItem('makemma-cart') || '{}');
        const wishlist = JSON.parse(localStorage.getItem('makemma-wishlist') || '[]');
        const productIds = new Set(products.map((product) => product.id));
        Object.keys(cart).forEach((id) => {
            if (!productIds.has(id)) delete cart[id];
        });
        const validWishlist = wishlist.filter((id) => productIds.has(id));
        wishlist.splice(0, wishlist.length, ...validWishlist);
        localStorage.setItem('makemma-cart', JSON.stringify(cart));
        localStorage.setItem('makemma-wishlist', JSON.stringify(wishlist));
        const cartPanel = document.getElementById('cart-panel');
        const cartOverlay = document.getElementById('cart-overlay');
        const panelContent = document.getElementById('panel-content');
        const cartFooter = document.getElementById('cart-footer');
        let activeTab = 'cart';

        const formatPrice = (price) => `$${price.toFixed(2)}`;
        const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[character]);
        const findProduct = (id) => products.find((product) => product.id === id);
        const categorySearchTerms = {
            labiales: ['labios', 'labial', 'labiales', 'lips', 'lip', 'lipstick', 'gloss'],
            bases: ['cara', 'base', 'bases', 'face', 'foundation'],
            mascaras: ['ojos', 'ojo', 'eyes', 'eye', 'mascara', 'eyeliner', 'eyeshadow', 'rímel', 'rimel'],
            iluminadores: ['iluminador', 'highlighter'],
            bronzers: ['bronzer'],
            rubores: ['rubor', 'blush'],
            sombras: ['sombra', 'eyeshadow'],
            delineadores: ['delineador', 'eyeliner', 'eye pencil'],
            desmaquilladores: ['desmaquillador', 'makeup remover'],
            correctores: ['corrector', 'concealer'],
            polvos: ['polvo fijador', 'setting powder']
        };
        const categoryProductTypes = {
            bases: ['bases', 'iluminadores', 'bronzers', 'rubores'],
            mascaras: ['mascaras', 'delineadores']
        };
        const visibleProductTypes = new Set(categoryProductTypes[categoryId] || [categoryId]);
        const normalizeSearchText = (value) => String(value)
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLocaleLowerCase('es')
            .trim();

        function renderProducts(query = '') {
            const normalizedQuery = normalizeSearchText(query);
            const matchingProducts = products.filter((product) =>
                visibleProductTypes.has(product.category) &&
                (!normalizedQuery || [
                    product.name,
                    product.category,
                    ...(categorySearchTerms[product.category] || [])
                ].some((term) => normalizeSearchText(term).includes(normalizedQuery)))
            );

            productGrid.innerHTML = matchingProducts.length ? matchingProducts.map((product) => {
                const isSaved = wishlist.includes(product.id);
                return `<article class="product-card is-loading" data-id="${escapeHtml(product.id)}" aria-busy="true">
                    <a class="product-link" href="producto.html?id=${encodeURIComponent(product.id)}" aria-label="Ver detalles de ${escapeHtml(product.name)}">
                        <span class="product-image"><img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.name)}"></span>
                        <h2>${escapeHtml(product.name)}</h2>
                    </a>
                    <p class="product-card-price">${formatPrice(product.price)}</p>
                    <div class="card-actions">
                        <button class="add-to-cart" data-action="add" type="button">Añadir al carrito</button>
                        <button class="wish-button${isSaved ? ' is-saved' : ''}" data-action="wish" type="button" aria-label="${isSaved ? 'Quitar de' : 'Guardar en'} favoritos" aria-pressed="${isSaved}">${isSaved ? '♥' : '♡'}</button>
                    </div>
                </article>`;
            }).join('') : normalizedQuery
                ? '<p class="no-results">No se encontraron productos con ese nombre.</p>'
                : '<p class="no-results">Aún no hay productos disponibles en esta categoría.</p>';
            productGrid.querySelectorAll('.product-card.is-loading').forEach((card) => {
                const image = card.querySelector('.product-image img');
                const finishLoading = () => {
                    card.classList.remove('is-loading');
                    card.removeAttribute('aria-busy');
                };
                if (image.complete) {
                    finishLoading();
                } else {
                    image.addEventListener('load', finishLoading, { once: true });
                    image.addEventListener('error', finishLoading, { once: true });
                }
            });
        }

        function renderCart() {
            const cartEntries = Object.entries(cart);
            const total = cartEntries.reduce((sum, [id, quantity]) => {
                const product = findProduct(id);
                return sum + (product ? product.price * quantity : 0);
            }, 0);
            document.getElementById('wishlist-count').textContent = wishlist.length;
            document.getElementById('cart-total').textContent = formatPrice(total);

            if (activeTab === 'cart') {
                panelContent.innerHTML = cartEntries.length ? cartEntries.map(([id, quantity]) => {
                    const product = findProduct(id);
                    if (!product) return '';
                    return `<div class="cart-item"><div><strong>${escapeHtml(product.name)}</strong><span>${formatPrice(product.price)} · ${quantity} unidad${quantity === 1 ? '' : 'es'}</span><div class="item-controls"><button class="quantity-button" data-action="decrease" data-id="${escapeHtml(id)}" type="button" aria-label="Restar una unidad">−</button><span>${quantity}</span><button class="quantity-button" data-action="increase" data-id="${escapeHtml(id)}" type="button" aria-label="Agregar una unidad">+</button></div></div><button class="remove-button" data-action="remove" data-id="${escapeHtml(id)}" type="button">Eliminar</button></div>`;
                }).join('') : '<p class="empty-message">Tu carrito está vacío.<br>Añade algún producto.</p>';
                cartFooter.hidden = false;
            } else {
                panelContent.innerHTML = wishlist.length ? wishlist.map((id) => {
                    const product = findProduct(id);
                    if (!product) return '';
                    return `<div class="cart-item"><div><strong>${escapeHtml(product.name)}</strong><span>${formatPrice(product.price)}</span></div><button class="add-to-cart" data-action="wishlist-add" data-id="${escapeHtml(id)}" type="button">Añadir</button></div>`;
                }).join('') : '<p class="empty-message">Todavía no has guardado favoritos.<br>Usa el corazón de cada producto.</p>';
                cartFooter.hidden = true;
            }
        }

        function setCartOpen(open) {
            cartPanel.classList.toggle('is-open', open);
            cartOverlay.classList.toggle('is-visible', open);
            cartPanel.setAttribute('aria-hidden', String(!open));
            document.getElementById('cart-toggle').setAttribute('aria-expanded', String(open));
            if (open) renderCart();
        }

        if (categoryName) {
            document.title = `${categoryName} | MADONCHELLE`;
            document.getElementById('category-title').textContent = categoryName;
        } else {
            document.title = 'Categoría no encontrada | MADONCHELLE';
            document.getElementById('category-title').textContent = 'Categoría no encontrada';
        }

        renderProducts();
        renderCart();
        searchInput.addEventListener('input', () => {
            renderProducts(searchInput.value);
        });
        productGrid.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;
            const id = button.closest('.product-card').dataset.id;
            if (button.dataset.action === 'add') {
                cart[id] = (cart[id] || 0) + 1;
                localStorage.setItem('makemma-cart', JSON.stringify(cart));
                renderCart();
                setCartOpen(true);
            } else if (button.dataset.action === 'wish') {
                const index = wishlist.indexOf(id);
                if (index === -1) wishlist.push(id);
                else wishlist.splice(index, 1);
                localStorage.setItem('makemma-wishlist', JSON.stringify(wishlist));
                renderProducts(searchInput.value);
                renderCart();
            }
        });

        document.getElementById('cart-toggle').addEventListener('click', () => setCartOpen(true));
        document.getElementById('cart-close').addEventListener('click', () => setCartOpen(false));
        cartOverlay.addEventListener('click', () => setCartOpen(false));

        document.querySelectorAll('.tab-button').forEach((button) => button.addEventListener('click', () => {
            activeTab = button.dataset.tab;
            document.querySelectorAll('.tab-button').forEach((tab) => {
                const selected = tab === button;
                tab.classList.toggle('is-active', selected);
                tab.setAttribute('aria-selected', String(selected));
            });
            renderCart();
        }));

        panelContent.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;
            const { action, id } = button.dataset;
            if (action === 'increase' || action === 'wishlist-add') cart[id] = (cart[id] || 0) + 1;
            if (action === 'decrease') cart[id] -= 1;
            if (action === 'remove' || cart[id] === 0) delete cart[id];
            localStorage.setItem('makemma-cart', JSON.stringify(cart));
            renderCart();
        });

        document.getElementById('checkout-button').addEventListener('click', () => {
            window.alert('Gracias por tu compra. Aquí conectarías la pasarela de pago.');
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && cartPanel.classList.contains('is-open')) setCartOpen(false);
        });
    </script>
</body>
</html>
